name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # tests/ 가 아직 없을 수 있어 있을 때만 실행한다.
        run: if [ -d tests ]; then npm test; else echo "tests/ 없음 — 건너뜀"; fi

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Docker image builds
        run: docker build -t ai-builder:ci .
