# campus.knowverse.net 배포 구성.
#
#   web     Next.js (UI + API)
#   worker  알림 처리. 앱 내 알림도 이 프로세스가 pending → sent 로 넘기므로 필수다.
#   caddy   HTTPS(자동 인증서). DB 하나를 모든 접속자가 공유하므로 사이트 인증을 쓴다.
#
# web 과 worker 는 같은 SQLite 파일(campus-data 볼륨)을 공유한다. lib/db.ts 가
# WAL + busy_timeout 을 켜므로 같은 호스트의 두 프로세스가 함께 써도 된다.

x-app: &app
  build: .
  image: ai-builder:latest
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: file:/app/data/campus.db
    PUBLIC_ACCESS_MODE: private
    PUBLIC_SESSION_DIR: /app/data/public-sessions
  volumes:
    - campus-data:/app/data

services:
  web:
    <<: *app
    environment:
      <<: *app-env
      APP_URL: ${APP_URL:?APP_URL 을 .env 에 설정하세요 (https://campus.knowverse.net)}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const headers={};if(process.env.PUBLIC_ACCESS_MODE!=='anonymous'&&process.env.BASIC_AUTH_USER&&process.env.BASIC_AUTH_PASSWORD)headers.Authorization='Basic '+Buffer.from(process.env.BASIC_AUTH_USER+':'+process.env.BASIC_AUTH_PASSWORD).toString('base64');fetch('http://127.0.0.1:3000/api/health',{headers,signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  campus-data:
  caddy-data:
  caddy-config:
